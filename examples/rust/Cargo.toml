[package]
name = "phrona-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runnable examples for the phrona library (cargo run -p phrona-examples --bin <name>)"
publish = false

[[bin]]
name = "basic"
path = "src/bin/basic.rs"

[[bin]]
name = "suggest"
path = "src/bin/suggest.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "ground"
path = "src/bin/ground.rs"

[dependencies]
phrona = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
