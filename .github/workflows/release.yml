name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: zip
          - os: macos-15
            target: x86_64-apple-darwin
            asset: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p phrona-cli -p phrona-api -p phrona-mcp

      - name: Package (unix)
        if: matrix.asset == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/phrona-${{ matrix.target }}.tar.gz" \
            -C target/release phrona phrona-api phrona-mcp
          sha256sum "dist/phrona-${{ matrix.target }}.tar.gz" > "dist/phrona-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.asset == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cd target/release
          powershell Compress-Archive -Path phrona.exe,phrona-api.exe,phrona-mcp.exe \
            -DestinationPath "../../dist/phrona-${{ matrix.target }}.zip"
          cd ../..
          sha256sum "dist/phrona-${{ matrix.target }}.zip" > "dist/phrona-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

  wheel:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            arch: x86_64
          - os: ubuntu-latest
            target: linux-aarch64
            arch: aarch64
          - os: macos-15
            target: macos-x86_64
            arch: x86_64
          - os: macos-latest
            target: macos-arm64
            arch: arm64
          - os: windows-latest
            target: windows-x86_64
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain (host)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Add x86_64 target (macos cross-compile)
        if: matrix.arch == 'x86_64' && runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # btls-sys needs a musl C++ toolchain that does not exist for
          # manylinux containers; musllinux wheels are skipped.
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_SKIP: "*"
          # btls-sys runs bindgen at build time; the manylinux images carry no
          # libclang and no clang resource dir, so install the pip-bundled
          # libclang and point bindgen at devtoolset's gcc headers.
          CIBW_BEFORE_ALL_LINUX: "/opt/python/cp39-cp39/bin/pip install --target /opt/libclang libclang && ln -sfn $(ls -d /opt/rh/devtoolset-10/root/usr/lib/gcc/*/10/include | head -1) /opt/clang-gcc-includes && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH=/root/.cargo/bin:$PATH LIBCLANG_PATH=/opt/libclang/clang/native BINDGEN_EXTRA_CLANG_ARGS="-idirafter /opt/clang-gcc-includes"'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl

  sdist:
    name: build (source dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          pip install --upgrade uv
          uv build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  release:
    name: publish release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Phrona ${{ github.ref_name }}

            Build artifacts:
            - `phrona`, `phrona-api`, `phrona-mcp` binaries
              (linux x86_64 / aarch64, windows x86_64, macos x86_64 / arm64)
            - Python wheels for CPython 3.9-3.13
              (linux x86_64 / aarch64, windows x86_64, macos x86_64 / arm64)
            - Source distribution (`phrona-*.tar.gz`)

            See the README and docs/ for usage:
            - CLI: `phrona --help`
            - Server: `phrona serve` (REST on 8080, MCP-over-TCP on 8081)
            - Web console: http://localhost:8080/
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    name: publish crates.io
    needs: [build]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish phrona, then its dependents
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p phrona
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p phrona-api
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p phrona-mcp
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p phrona-cli
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN" -p phrona-python

  publish-pypi:
    name: publish PyPI
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish wheels and sdist to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_TOKEN }}

