name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p metasearch-cli -p metasearch-api -p metasearch-mcp

      - name: Package (unix)
        if: matrix.asset == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/metasearch-${{ matrix.target }}.tar.gz" \
            -C target/release ms metasearch-api metasearch-mcp
          sha256sum "dist/metasearch-${{ matrix.target }}.tar.gz" > "dist/metasearch-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.asset == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cd target/release
          powershell Compress-Archive -Path ms.exe,metasearch-api.exe,metasearch-mcp.exe \
            -DestinationPath "../../dist/metasearch-${{ matrix.target }}.zip"
          cd ../..
          sha256sum "dist/metasearch-${{ matrix.target }}.zip" > "dist/metasearch-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

  wheel:
    name: build (python wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build wheel
        run: |
          pip install --upgrade uv
          uv build
      - name: Rename for release
        run: |
          mkdir -p dist && cp dist/*.whl dist/metasearch-wheel.whl 2>/dev/null || true
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: build-wheel
          path: dist/

  release:
    name: publish release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## MetaSearchRS ${{ github.ref_name }}

            Build artifacts:
            - `ms`, `metasearch-api`, `metasearch-mcp` binaries
              (linux x86_64 / aarch64, windows x86_64, macos aarch64)
            - Python wheel (`metasearch-wheel.whl`)

            See the README and docs/ for usage:
            - CLI: `ms --help`
            - Server: `ms serve` (REST on 8080, MCP-over-TCP on 8081)
            - Web console: http://localhost:8080/console.html
          files: artifacts/*
          generate_release_notes: true
