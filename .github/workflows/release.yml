name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p phrona-cli -p phrona-api -p phrona-mcp

      - name: Package (unix)
        if: matrix.asset == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/phrona-${{ matrix.target }}.tar.gz" \
            -C target/release phrona phrona-api phrona-mcp
          sha256sum "dist/phrona-${{ matrix.target }}.tar.gz" > "dist/phrona-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.asset == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          cd target/release
          powershell Compress-Archive -Path phrona.exe,phrona-api.exe,phrona-mcp.exe \
            -DestinationPath "../../dist/phrona-${{ matrix.target }}.zip"
          cd ../..
          sha256sum "dist/phrona-${{ matrix.target }}.zip" > "dist/phrona-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

  wheel:
    name: build (python wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build wheel
        run: |
          pip install --upgrade uv
          uv build
      - name: Rename for release
        run: |
          mkdir -p dist
          cp "$(ls dist/phrona-*.whl | head -n1)" dist/phrona-wheel.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: build-wheel
          path: dist/

  release:
    name: publish release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Phrona ${{ github.ref_name }}

            Build artifacts:
            - `phrona`, `phrona-api`, `phrona-mcp` binaries
              (linux x86_64 / aarch64, windows x86_64, macos aarch64)
            - Python wheel (`phrona-wheel.whl`)

            See the README and docs/ for usage:
            - CLI: `phrona --help`
            - Server: `phrona serve` (REST on 8080, MCP-over-TCP on 8081)
            - Web console: http://localhost:8080/
          files: artifacts/*
          generate_release_notes: true

  publish-crates:
    name: publish crates.io
    needs: [build]
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Publish phrona, then its dependents
        run: |
          cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" -p phrona
          cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" -p phrona-api
          cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" -p phrona-mcp
          cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" -p phrona-cli

  publish-pypi:
    name: publish PyPI
    needs: [wheel]
    if: ${{ secrets.PYPI_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and publish wheel
        run: |
          pip install --upgrade uv
          uv build
          uv publish --token "${{ secrets.PYPI_TOKEN }}"

