name: upstream-watch

on:
  schedule:
    - cron: "0 6 * * 1" # weekly: Monday 06:00 UTC
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream drift
        id: drift
        run: |
          ./scripts/watch_upstream.sh --json > /tmp/drift.json || true

      - name: Open or update issue on drift
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/drift.json')) {
              console.log('No drift file generated.');
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/drift.json', 'utf8'));
            } catch (err) {
              console.error('Failed to parse drift.json:', err);
              return;
            }

            if (!report.drift || report.drift.length === 0) {
              console.log('No upstream drift detected.');
              return;
            }

            const lines = report.drift.map(d => `- ${d}`).join('\n');
            const body = [
              'Upstream repositories moved past their pinned commits. See docs/upstream.md for what each project contributed and how to monitor.',
              '',
              '**Drift:**',
              lines,
              '',
              'Suggested follow-up: diff the affected repo against the pinned commit, update scripts/upstream-refs.txt only after rebasing, and verify with the fixture workflow (`cargo run -p phrona --bin fetch_fixtures` + `dbg_parse`).',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const open = issues.data.find(i => i.title === 'Upstream drift detected');
            if (open) {
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Upstream drift detected', body });
            }