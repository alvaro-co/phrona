name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit dependencies
        run: cargo audit

      - name: Deny policy check (licenses, bans, sources)
        run: cargo deny check

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p phrona-cli -p phrona-api -p phrona-mcp

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build wheel
        run: |
          pip install --upgrade uv
          uv build

      - name: Install and import-check the wheel
        run: |
          uv venv --python 3.12 /tmp/msenv
          uv pip install --python /tmp/msenv/bin/python dist/phrona-*.whl
          /tmp/msenv/bin/python -c "import phrona; print(phrona.version())"
