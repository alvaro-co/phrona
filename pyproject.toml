[project]
name = "metasearch"
version = "0.1.0"
description = "High-performance metasearch engine library - Rust core with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[build-system]
requires = ["setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[tool.setuptools-rust]
bin = false

[[tool.setuptools-rust.ext-modules]]
target = "metasearch"
path = "crates/metasearch-python/Cargo.toml"

[tool.setuptools]
py-modules = []
