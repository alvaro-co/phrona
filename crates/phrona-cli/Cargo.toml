[package]
name = "phrona-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/phrona-cli"
description = "Command-line interface to the phrona library: search, suggest, extract, ground, probe"
repository.workspace = true
homepage = "https://github.com/alvaro-co/phrona"
keywords = ["search", "cli", "phrona", "mcp"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "phrona"
path = "src/main.rs"

[dependencies]
phrona = { workspace = true }
phrona-api = { path = "../phrona-api", version = "0.2.0" }
phrona-mcp = { path = "../phrona-mcp", version = "0.2.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
