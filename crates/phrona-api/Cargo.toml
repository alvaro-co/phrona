[package]
name = "phrona-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/phrona-api"
description = "REST API for the phrona library: search, suggestions, AI grounding, Tavily-compatible endpoint"
repository.workspace = true
homepage = "https://github.com/alvaro-co/phrona"
keywords = ["search", "api", "rest", "phrona"]
categories = ["web-programming::http-server"]
readme = "README.md"

[dependencies]
phrona = { workspace = true }
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
url.workspace = true
prometheus = { version = "0.14.0", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
