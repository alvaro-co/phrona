[workspace]
resolver = "2"
members = [
    "crates/metasearch",
    "crates/metasearch-api",
    "crates/metasearch-mcp",
    "crates/metasearch-python",
]
default-members = ["crates/metasearch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/metasearchrs/metasearch"
rust-version = "1.85"

[workspace.dependencies]
metasearch = { path = "crates/metasearch" }
wreq = { version = "6.0.0-rc.29", features = ["cookies", "gzip", "brotli", "zstd", "deflate", "charset"] }
wreq-util = { version = "3.0.0-rc.14", features = ["emulation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.26"
url = "2"
percent-encoding = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pyo3 = { version = "0.24", features = ["extension-module"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
